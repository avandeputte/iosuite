# ioSuite with Docker: `docker compose up -d` pulls the published image; `docker compose up -d --build` builds it
# from this checkout. Works as a stack in Dockge / Portainer. Edit the CHANGE ME spots.
services:
  iosuite:
    image: ghcr.io/avandeputte/iosuite:latest
    build: .
    container_name: iosuite
    restart: unless-stopped
    ports:
      - "8630:8630"     # the start page and its REST API (/api/)
    environment:
      TZ: America/New_York
      DB_HOST: 192.168.1.89           # CHANGE ME: your MariaDB host
      DB_PORT: "3306"
      DB_NAME: suite
      DB_USER: suite
      DB_PASSWORD: suite              # CHANGE ME
      # the accounts shared by the io apps (the same database ioPix, ioNotes, ioContacts, ioCalendar and ioHealth use)
      IOTHING_AUTH_DB_HOST: 192.168.1.89   # CHANGE ME
      IOTHING_AUTH_DB_PORT: "3306"
      IOTHING_AUTH_DB_NAME: auth
      IOTHING_AUTH_DB_USER: auth
      IOTHING_AUTH_DB_PASSWORD: change-me  # CHANGE ME
      # ADMIN_USER: admin             # a first admin, made on the first start when there is no account yet
      # ADMIN_PASSWORD: change-me-please
      # PUBLIC_URL: https://home.example.com       # behind a reverse proxy
      # IOTHING_COOKIE_DOMAIN: example.com         # one sign-in for every io app under this domain
      # AUTH_PROXY: cloudflare        # sign-in at the proxy, as in the other io apps (see README)
      # where the apps are (or Settings › Apps in the web app; empty: this host, each app's usual port)
      # IOPIX_URL: https://photos.example.com
      # IOHEALTH_URL: https://health.example.com
      # IOCALENDAR_URL: https://calendar.example.com
      # IOCONTACTS_URL: https://contacts.example.com
      # IONOTES_URL: https://notes.example.com
      # the weather (or Settings › Weather): a key from developer.accuweather.com and a location key Settings finds
      # ACCUWEATHER_API_KEY: change-me
      # ACCUWEATHER_LOCATION: "349727"
