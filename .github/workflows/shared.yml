# The shared library's own tests against a MariaDB service, when shared/ changes. Every app's workflow runs on such a
# change too (its tests use the library at the same commit), and each checks that the update.sh files match the template.
# The suite's version is the library's (shared/iosuite_shared/__init__.py); version.yml sets it on main, makes the
# release v<version> and starts the apps' workflows, which tag their images with the same version.
name: Shared library

on:
  push:
    branches: [main]
    paths: ["shared/**", "demo/**", "*/update.sh", "*/setup.sh", "*/run.sh", "*/app.json", "*/proxmox/ct/**", "install.sh", "docs/landing/compose/compose.js", ".github/workflows/shared.yml"]
  pull_request:
    paths: ["shared/**", "demo/**", "*/update.sh", "*/setup.sh", "*/run.sh", "*/app.json", "*/proxmox/ct/**", "install.sh", "docs/landing/compose/compose.js", ".github/workflows/shared.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: shared

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          python -m pip install -q -e ".[test]"
          python -m pyflakes iosuite_shared tests
          node --input-type=module --check < iosuite_shared/static/suite-admin.js
          node --input-type=module --check < iosuite_shared/static/server-panel.js
          node --input-type=module --check < iosuite_shared/static/account-panel.js
          node --check iosuite_shared/static/push-sw.js
          sh -n templates/update.sh templates/setup.sh templates/run.sh
          python3 templates/render-update.py --check
          python3 templates/render.py --check  # apps.json from the apps' app.json, the lists of apps made from them, setup.sh and run.sh of every app
      - name: Tests
        env:
          IOSUITE_TEST_DB: 127.0.0.1:3306:root:root
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Edge worker tests
        working-directory: shared/cloudflare/edge-auth
        run: node --test
