# Tests against a MariaDB service, then builds the container image and pushes it to ghcr.io (ghcr.io/avandeputte/iosuite/iohealth)
# on pushes to main (tags `latest` and `main-<sha>`) and version tags like v2.0.0 (pull requests only build).
name: ioHealth

on:
  push:
    branches: [main]
    paths: ["iohealth/**", "shared/**", ".github/workflows/iohealth.yml"]
  pull_request:
    paths: ["iohealth/**", "shared/**", ".github/workflows/iohealth.yml"]
  workflow_dispatch:

# every step runs in the app's folder; the shared library sits beside it in shared/
defaults:
  run:
    working-directory: iohealth

env:
  IMAGE: ghcr.io/avandeputte/iosuite/iohealth

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and import checks
        run: |
          python -m pip install -q -e ../shared
          python -m pip install -q -e ".[test]"
          python3 ../shared/templates/render-update.py --check
          python -m pyflakes app tests
          python -c "import app.main"
          node --check static/app.js
          bash -n proxmox/ct/iohealth.sh proxmox/install/iohealth-install.sh
          sh -n setup.sh run.sh update.sh
      - name: Tests on MariaDB
        # scratch databases health_test and health_test_auth on the service (iosuite_shared.testing)
        env:
          IOSUITE_TEST_DB: 127.0.0.1:3306:root:root
        run: python -m pytest -q -p no:cacheprovider tests

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: iohealth/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=iohealth
          cache-to: type=gha,mode=max,scope=iohealth
