# Compiles the iPhone app (ios/) for the simulator, unsigned, when it changes: a check that it builds.
# Signed builds for a phone or TestFlight are made on a Mac with the team's certificate (ios/README.md).
name: iOS app

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Make the Xcode project
        working-directory: ios
        run: |
          which xcodegen || brew install xcodegen
          xcodegen
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild -version
          set -o pipefail
          xcodebuild build -project ioBookmarks.xcodeproj -scheme ioBookmarks -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO | tail -n 150
