name: docs
# The website (iosuite.iothing.net), in docs/. Its pages are checked against the apps' folders, so a change in an app
# that makes a page wrong fails here, in the same pull request.
on:
  push:
    branches: [main]
    paths: ["docs/**", "*/proxmox/ct/**", "*/docker-compose.yml", "docker-compose.yml", "shared/iosuite_shared/install.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "*/proxmox/ct/**", "*/docker-compose.yml", "docker-compose.yml", "shared/iosuite_shared/install.py", ".github/workflows/docs.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: docs
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sh build.sh
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Deploy to Cloudflare Workers
        # only from main, and only once the Cloudflare secrets are set (see docs/CLOUDFLARE.md); wrangler.jsonc says what
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
