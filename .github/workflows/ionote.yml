# Tests on SQLite and on MariaDB, then builds the container image and pushes it to GitHub's registry (ghcr.io) on
# every push to main, also tagged v<the suite's version> (shared/iosuite_shared/__init__.py); pull requests only build. The shared accounts go in scratch databases
# on the same MariaDB (iosuite_shared.testing, IOSUITE_TEST_DB).
name: ioNote

on:
  push:
    branches: [main]
    paths: ["ionote/**", "shared/**", ".github/workflows/ionote.yml"]
  pull_request:
    paths: ["ionote/**", "shared/**", ".github/workflows/ionote.yml"]
  workflow_dispatch:

# every step runs in the app's folder; the shared library sits beside it in shared/
defaults:
  run:
    working-directory: ionote

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/avandeputte/iosuite/ionote

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: notes_test
          MARIADB_USER: notes
          MARIADB_PASSWORD: notes
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and import checks
        run: |
          python -m pip install -q -e ../shared
          python -m pip install -q -e ".[test]"
          python3 ../shared/templates/render-update.py --check
          python -m pyflakes app tests
          python -c "import app.main"
          for f in static/app.js static/js/*.js; do node --input-type=module --check < "$f" || exit 1; done; node --check static/sw.js
          for f in *.sh; do sh -n "$f"; done
          bash -n proxmox/ct/ionote.sh proxmox/install/ionote-install.sh
      - name: Tests on SQLite
        env:
          IOSUITE_TEST_DB: 127.0.0.1:3306:root:root
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Tests on MariaDB
        env:
          IONOTE_TEST_DB: mysql
          IOSUITE_TEST_DB: 127.0.0.1:3306:root:root
        run: python -m pytest -q -p no:cacheprovider tests

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' ../shared/iosuite_shared/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ionote/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCR=1
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ionote
          cache-to: type=gha,mode=max,scope=ionote
