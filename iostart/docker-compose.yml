# ioStart with Docker: `docker compose up -d` pulls the published image; `docker compose up -d --build` builds it
# from this checkout. Works as a stack in Dockge / Portainer. Edit the CHANGE ME spots.
services:
  iostart:
    image: ghcr.io/avandeputte/iosuite/iostart:latest
    build: {context: .., dockerfile: iostart/Dockerfile}   # from a checkout of the suite's repository: its root is the build context
    container_name: iostart
    restart: unless-stopped
    logging:                          # the output Docker keeps (the app's log, again): at most 3 files of 5 MB
      driver: json-file
      options: {max-size: 5m, max-file: "3"}
    ports:
      - "8630:8630"     # the start page and its REST API (/api/)
    environment:
      TZ: America/New_York
      DB_HOST: db.example.lan         # CHANGE ME: your MariaDB host
      DB_PORT: "3306"
      DB_NAME: suite
      DB_USER: suite
      DB_PASSWORD: change-me          # CHANGE ME
      # the accounts shared by the io apps (the same database ioPix, ioNote, ioContact, ioCalendar and ioHealth use)
      # IOSUITE_DB_HOST: db.example.lan   # default: DB_HOST
      # IOSUITE_DB_PORT: "3306"            # default: DB_PORT
      IOSUITE_DB_NAME: iostart
      IOSUITE_DB_USER: iostart
      IOSUITE_DB_PASSWORD: change-me  # CHANGE ME
      # ADMIN_USER: admin             # a first admin, made on the first start when there is no account yet
      # ADMIN_PASSWORD: change-me-please
      # PUBLIC_URL: https://home.example.com       # behind a reverse proxy
      # INTERNAL_URL: http://192.168.1.151:8630   # the host's LAN address and port, kept in the suite's list of apps (a container cannot tell)
      # COOKIE_DOMAIN: example.com                 # one sign-in for every app of the suite under this domain
      # AUTH_PROXY: cloudflare        # sign-in at the proxy, as in the other io apps (see README)
      # the weather (or Settings › Home page): a key from developer.accuweather.com and a location key Settings finds
      # ACCUWEATHER_API_KEY: change-me
      # ACCUWEATHER_LOCATION: "349727"
