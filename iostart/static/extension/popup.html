<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ioStart Bookmarks</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
  <div class="brand"><img src="icons/48.png" alt=""><span><span class="io">io</span><span class="nm">Suite</span> <span class="what">Bookmarks</span></span></div>
  <div class="status"><span class="dot" id="dot"></span><span id="state"></span></div>
  <div class="muted small" id="who"></div>
  <div class="row">
    <button class="primary" id="sync">Sync now</button>
    <button class="primary" id="signin" hidden>Sign in</button>
    <span class="grow"></span>
    <button class="link" id="open" hidden>Start page</button>
    <button class="link" id="settings">Settings</button>
  </div>
  <script src="lib.js"></script><script src="popup.js"></script>
</body>
</html>
