[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iocalendar"
version = "0.12.0"
description = "Self-hosted calendars for the family: web app, CalDAV, iCalendar feeds, REST/jCal, MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "iosuite-shared @ git+https://github.com/avandeputte/iosuite-shared.git@626c8513f2965c79ed1db8ed8b1dacf3b93bc615",   # iosuite-shared 0.14.0, the suite's shared library: accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "mcp<3",                        # the MCP server at /mcp
  "icalendar>=6,<8",              # iCalendar (RFC 5545) reading and writing
  "recurring-ical-events>=3,<4",  # repeating events: RRULE, RDATE, EXDATE and changed occurrences
  "python-dateutil>=2.8,<3",
  "holidays>=0.60,<1",            # public holidays by country and region, worked out offline
  "tzdata",                       # time zones on systems without /usr/share/zoneinfo
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "pyflakes<4"]

[project.urls]
Homepage = "https://github.com/avandeputte/iocalendar"

[tool.setuptools.packages.find]
include = ["app*"]
