[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iocalendar"
version = "0.0.0"  # not this app's version: the suite has one, iosuite_shared.__version__ (shared/iosuite_shared/__init__.py)
description = "Self-hosted calendars for the family: web app, CalDAV, iCalendar feeds, REST/jCal, MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
  "iosuite-shared",   # the suite's shared library (shared/ of this repository): setup.sh, update.sh and the Dockerfile install it from there, at the same commit
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "mcp<3",                        # the MCP server at /mcp
  "defusedxml<1",                 # CalDAV request bodies
  "icalendar>=6,<8",              # iCalendar (RFC 5545) reading and writing
  "recurring-ical-events>=3.8,<4",  # repeating events: RRULE, RDATE, EXDATE and changed occurrences
  "python-dateutil>=2.8,<3",
  "holidays>=0.60,<1",            # public holidays by country and region, worked out offline
  "tzdata",                       # time zones on systems without /usr/share/zoneinfo
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "pyflakes<4"]

[project.urls]
Homepage = "https://github.com/avandeputte/iosuite/tree/main/iocalendar"

[tool.setuptools.packages.find]
include = ["app*"]
