[iostart]
name = "ioStart"
color = "#2f3a5a"
port = 8630
tag = "The start page"
eyebrow = "the start page · optional"
headline = "Every app, and today, on one page."
lede = "A home page for the family: a tile for each installed app with what matters today on it, the week ahead, a search box across everything, bookmarks and the weather. <strong>It is optional</strong>: every app works without it. It earns its place once you run two or more."
chips = ["Finds the apps by itself", "⌘K search", "Wall display", "One MCP server for the suite", "Bookmarks in every browser"]
hero = "iostart.jpg"
hero_alt = "The ioStart start page: a tile per app with today on it, birthdays, the week ahead and bookmarks"
phone = "iostart-phone.jpg"
phone_alt = "The start page on a phone"
alone = "ioStart needs the Shared ioSuite database and nothing else. Without other apps it is a page of bookmarks, the weather and a search box; each app you add brings its own tile."

[[iostart.highlights]]
title = "A glimpse of each app"
text = "ioPix shows the photos from this day in earlier years, ioCalendar the rest of today, ioTask what is due, ioHealth the steps, the rings and last night's sleep. Each person sees only what that app shows them, asked with their own sign-in."
img = "iostart.jpg"
alt = "Tiles for ioHealth, ioCalendar, ioTask and the other apps, with today's details"

[[iostart.highlights]]
title = "One search box for everything"
text = "⌘K or Ctrl-K searches the apps and the bookmarks at once: tasks, events, notes, recipes, things and people, with the web as a fallback. Type “dentist tomorrow 9am” and Quick add puts it in the calendar."
img = "iostart-search.jpg"
alt = "The search box open, with tasks and the apps that match"

[[iostart.highlights]]
title = "Light, dark, and yours"
text = "Each person hides and orders the tiles and cards. Light, dark or the device's theme, kept with the account. On a tablet on the wall, the wall display shows photos behind a big clock, the weather and the coming days' events."
img = "iostart-dark.jpg"
alt = "The start page in dark mode"

[[iostart.features]]
title = "A tile per app, found by itself"
text = "Every app registers in the suite's list of apps, so there is nothing to type. An app that isn't installed has no tile; one that is down keeps its last tile."
[[iostart.features]]
title = "The week ahead"
text = "A Birthdays card from ioContact and a This week card from ioCalendar."
[[iostart.features]]
title = "Weather and Home Assistant"
text = "AccuWeather (a free key) for the forecast, and Home Assistant entities you can switch from the page."
[[iostart.features]]
title = "Bookmarks"
text = "Groups of links with their status, the ioStart Bookmarks extension for Chrome, Edge, Firefox and the others, an iPhone app, and Floccus."
[[iostart.features]]
title = "One MCP server for the suite"
text = "Connect an AI assistant here once and it gets every app's tools, each app still deciding what you may do there."
[[iostart.features]]
title = "One address for every app"
text = "When a suite admin turns it on, the start page answers for every app, each in a folder: one name, one certificate, one port."
[[iostart.features]]
title = "Updates for the whole suite"
text = "Settings › Global settings › Updates shows the suite's version on every app and brings them all up to date with one button."

[[iostart.together]]
app = "iocalendar"
text = "today's events on the tile, a This week card, and Quick add from the search box."
[[iostart.together]]
app = "iopix"
text = "photos from this day in earlier years, and a strip of photos under the tiles."
[[iostart.together]]
app = "iocontact"
text = "the Birthdays card, and people in the search box."
[[iostart.together]]
app = "iohealth"
text = "today's steps, the rings and last night's sleep."

