# The content of the app pages (iosuite.iothing.net/ioContact/ and the others), one table per app.
# tools/app-pages.py turns it into site/<name>/index.html at build time (build.sh), with the look of the home page.
#
#   name, color, port, tag      the app's name, colour, default port and one-line description
#   eyebrow, headline, lede     the top of the page; lede may hold <strong>, <a> and <code>
#   chips                       short facts under the lede
#   hero / hero_alt / phone     the big screenshot, its description, and the phone screenshot beside it (optional)
#   highlights                  a few things worth seeing, each with a screenshot (img in landing/img/)
#   features                    everything it does, as cards
#   works_with                  phones, apps and standards it speaks to (optional)
#   alone                       what it needs to run on its own
#   together                    what it does with each other app (app = the other app's key)
#   links                       more links for the top of the page (optional)
#
# Keep it true to the app: the guide's page (docs/apps/<key>.md) is the reference for what each app does.

order = ["iostart", "iopix", "ionote", "iocalendar", "iotask", "iorecipe", "iothings", "iomoney", "iodocs", "iocontact", "iohealth"]

