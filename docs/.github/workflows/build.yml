name: build
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"      # the pages describe the apps: check them against the apps' code nightly
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sh build.sh
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Deploy to Cloudflare Workers
        # only from main, and only once the Cloudflare secrets are set (see CLOUDFLARE.md); wrangler.jsonc says what
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy
