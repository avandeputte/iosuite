[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iotask"
version = "0.9.0"
description = "Self-hosted task lists for the family: web app, CalDAV to-dos for Apple Reminders, REST, MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
  "iosuite-shared",   # the suite's shared library (shared/ of this repository): setup.sh, update.sh and the Dockerfile install it from there, at the same commit
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "mcp<3",                        # the MCP server at /mcp
  "defusedxml<1",                 # CalDAV request bodies
  "icalendar>=6,<8",              # iCalendar (RFC 5545) reading and writing
  "python-dateutil>=2.8,<3",      # the next due date of a repeating task (RRULE)
  "tzdata",                       # time zones on systems without /usr/share/zoneinfo
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "pyflakes<4"]

[project.urls]
Homepage = "https://github.com/avandeputte/iosuite/tree/main/iotask"

[tool.setuptools.packages.find]
include = ["app*"]
