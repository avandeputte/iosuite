# ionotes: one place for the Python dependencies. The base set runs the server; the optional groups add
# text recognition for pictures added in the web app (setup.sh asks):
#   pip install -e '.[ocr]'
#   pip install -e '.[test]'                      (pytest)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ionotes"
version = "1.4.0"
description = "Notes from the clipboard, screenshots and the share sheet, kept in MariaDB, with a web app and the API the Mac and iPhone apps use"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# upper bounds: the next major version of each package as installed and tested (the same as iopix)
dependencies = [
  "fastapi<1",
  "uvicorn<1",
  "pillow<13",
  "pillow-heif<2",
  "orjson<4",
  "pymysql<2",
  "python-multipart<1",
  "mcp<3",
  "pyjwt[crypto]<3",   # Cloudflare Access tokens (proxy sign-in)
  "iothing-auth @ git+https://github.com/avandeputte/iosuite-shared.git@8f66960c4e46a56f3b030732092c8af0f1876fbf",   # the ioSuite shared library (avandeputte/iosuite-shared, formerly iothing-auth; package iothing-auth): accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
]

[project.optional-dependencies]
ocr = ["rapidocr<4", "onnxruntime<2", "numpy<3"]   # text in pictures added in the web app
test = ["pytest<10", "httpx<1", "pyflakes<5"]

[project.urls]
Homepage = "https://github.com/avandeputte/ionotes"

[tool.setuptools.packages.find]
include = ["app*"]
