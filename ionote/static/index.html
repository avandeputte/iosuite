<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ionotes</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c5a5e">
<script src="js/theme.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="topbar">
  <button id="menubtn" class="iconbtn" title="Show the sidebar" aria-label="Show the sidebar"><span class="ic" data-ic="menu"></span></button>
  <a class="brand" href="#/notes" title="All notes"><img src="icons/mark-64.png" alt="" width="28" height="28"><span class="brand-name"><span class="io">io</span><span class="nm">notes</span></span></a>
  <div id="search">
    <span class="ic" data-ic="search"></span>
    <input id="q" type="search" placeholder="Search notes, text in pictures, tags…" autocomplete="off" spellcheck="false" aria-label="Search">
  </div>
  <button id="newbtn" class="pillbtn primary" title="New note (N)"><span class="ic" data-ic="add"></span><span class="lbl">New note</span></button>
  <span id="usermenu"></span>
</header>
<nav id="nav" aria-label="Folders and tags"></nav>
<div id="navscrim" hidden></div>
<main id="main"></main>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="drop" hidden><div>Drop a picture to make it a note</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
