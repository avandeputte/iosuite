# ioBookmarks: the iPhone and iPad app for the start page's bookmarks, with its share extension.
# The Xcode project is generated from this file:  brew install xcodegen && cd ios && xcodegen
name: ioBookmarks

options:
  bundleIdPrefix: net.iothing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: 69M2JRAT8P
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ioBookmarks:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: ioBookmarksShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iobookmarks
        PRODUCT_NAME: ioBookmarks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ioBookmarks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # a start page on the home network may be plain http; the built-in browser opens whatever was bookmarked
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: App/ioBookmarks.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.iothing.iobookmarks

  ioBookmarksShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.iothing.iobookmarks.share
        PRODUCT_NAME: ioBookmarksShare
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ioBookmarks
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: ShareExtension/ioBookmarksShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.net.iothing.iobookmarks

schemes:
  ioBookmarks:
    build:
      targets:
        ioBookmarks: all
    run:
      config: Debug
    archive:
      config: Release
