[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iocontacts"
version = "0.4.2"
description = "Self-hosted contacts for the family: web app, CardDAV, LDAP, REST/jCard, birthday calendar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "iothing-auth @ git+https://github.com/avandeputte/iothing-auth.git",   # the ioThing suite's shared accounts and sessions
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",   # Cloudflare Access tokens (proxy sign-in)
  "mcp>=2,<3",         # the MCP server at /mcp
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "ldap3<3"]

[project.urls]
Homepage = "https://github.com/avandeputte/iocontacts"

[tool.setuptools.packages.find]
include = ["app*"]
