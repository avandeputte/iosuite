[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iocontacts"
version = "0.43.0"
description = "Self-hosted contacts for the family: web app, CardDAV, LDAP, REST/jCard, birthday calendar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "iosuite-shared @ git+https://github.com/avandeputte/iosuite-shared.git@d55b6a9801e4d0beac9f00f3627fe1b5767c5f1c",   # iosuite-shared 0.41.0, the suite's shared library: accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",   # Cloudflare Access tokens (proxy sign-in)
  "mcp<3",             # the MCP server at /mcp
  "defusedxml<1",      # CardDAV request bodies
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "ldap3<3", "pyflakes<4"]

[project.urls]
Homepage = "https://github.com/avandeputte/iocontacts"

[tool.setuptools.packages.find]
include = ["app*"]
