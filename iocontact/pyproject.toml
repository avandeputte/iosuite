[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iocontacts"
version = "0.10.0"
description = "Self-hosted contacts for the family: web app, CardDAV, LDAP, REST/jCard, birthday calendar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "iosuite-shared @ git+https://github.com/avandeputte/iosuite-shared.git@f2253b350dfecaf633c81773807b159c06c4b0b7",   # iosuite-shared 0.9.0, the suite's shared library: accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",   # Cloudflare Access tokens (proxy sign-in)
  "mcp>=2,<3",         # the MCP server at /mcp
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "ldap3<3"]

[project.urls]
Homepage = "https://github.com/avandeputte/iocontacts"

[tool.setuptools.packages.find]
include = ["app*"]
