[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iorecipe"
version = "0.3.0"
description = "Self-hosted recipes for the family: web app with photos and import from the web, REST, MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "iosuite-shared @ git+https://github.com/avandeputte/iosuite-shared.git@4c6177b58cc1eaca28573f64ac5f8aebee805147",   # iosuite-shared 0.45.0, the suite's shared library: accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "mcp<3",                        # the MCP server at /mcp
  "pillow>=10,<13",               # the recipe photos: checked, turned upright, made smaller
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "pyflakes<4"]

[project.urls]
Homepage = "https://github.com/avandeputte/iorecipe"

[tool.setuptools.packages.find]
include = ["app*"]
