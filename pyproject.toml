[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iosuite"
version = "0.9.1"
description = "The start page of the ioThing suite: one place with every io app (ioPix, ioHealth, ioCalendar, ioContacts, ioNotes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "iosuite-shared @ git+https://github.com/avandeputte/iosuite-shared.git@d1fab9c29061079eea76d9bcc493740f09400ebb",   # iosuite-shared 0.9.0, the suite's shared library: accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "pyyaml<7",                     # importing a homepage bookmarks.yaml
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1"]

[project.urls]
Homepage = "https://github.com/avandeputte/iosuite"

[tool.setuptools.packages.find]
include = ["app*"]
