[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iosuite"
version = "0.36.0"
description = "The start page of the ioThing suite: one place with every io app (ioPix, ioHealth, ioCalendar, ioContacts, ioNotes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "iosuite-shared @ git+https://github.com/avandeputte/iosuite-shared.git@d260ab4cac28ecebd3adf18f4bb2516bddf0e006",   # iosuite-shared 0.38.0, the suite's shared library: accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn>=0.29,<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "defusedxml<1",                 # an uploaded SVG icon
  "pyyaml<7",                     # importing a homepage bookmarks.yaml
  "websockets<16",                # Home Assistant's live feed (app/ha_feed.py)
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "pyflakes<4"]

[project.urls]
Homepage = "https://github.com/avandeputte/iosuite"

[tool.setuptools.packages.find]
include = ["app*"]
