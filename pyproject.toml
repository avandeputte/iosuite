[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iosuite"
version = "0.2.3"
description = "The start page of the iothing suite: one place with every io app (ioPix, ioHealth, ioCalendar, ioContacts, ioNotes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "iothing-auth @ git+https://github.com/avandeputte/iothing-auth.git@v0.2.0",   # the ioThing suite's shared accounts and sessions (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "pyyaml<7",                     # importing a homepage bookmarks.yaml
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1"]

[project.urls]
Homepage = "https://github.com/avandeputte/iosuite"

[tool.setuptools.packages.find]
include = ["app*"]
