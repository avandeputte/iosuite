[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iobackup"
version = "0.1.0"
description = "Backups of the suite's MariaDB servers, on a schedule, to a folder or Google Drive, with retention and a restore of exactly what you pick"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "iosuite-shared @ git+https://github.com/avandeputte/iosuite-shared.git@3c74d301fb1c82b2740280b8aba3a862690097b2",   # iosuite-shared 0.37.0, the suite's shared library: accounts, sessions, the Shared ioSuite database (pinned: bump to pick up a new one)
  "fastapi<1",
  "uvicorn<1",
  "pymysql<2",
  "python-multipart<1",
  "pyjwt[crypto]<3",              # Cloudflare Access tokens (proxy sign-in)
  "requests<3",                   # Google Drive
]

[project.optional-dependencies]
test = ["pytest<10", "pyflakes<4", "httpx<1"]

[project.urls]
Homepage = "https://github.com/avandeputte/iobackup"

[tool.setuptools.packages.find]
include = ["app*"]
