# ioHealth server: the Python dependencies. `pip install -e '.[test]'` adds pytest.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iohealth"
version = "0.0.0"  # not this app's version: the suite has one, iosuite_shared.__version__ (shared/iosuite_shared/__init__.py)
description = "Apple Health data from the iPhone in your own MariaDB, with a fitness web app, over the ioThing suite's shared accounts"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
# upper bounds: the next major version of each package as installed and tested (the same as iopix and ionote)
dependencies = [
  "fastapi<1",
  "uvicorn<1",
  "orjson<4",
  "pymysql<2",
  "pyjwt[crypto]<3",   # Cloudflare Access tokens (proxy sign-in)
  "tzdata",            # the browser's time zone, on an image without zoneinfo
  "iosuite-shared",   # the suite's shared library (shared/ of this repository): setup.sh, update.sh and the Dockerfile install it from there, at the same commit
]

[project.optional-dependencies]
test = ["pytest<10", "httpx<1", "pyflakes<5"]

[project.urls]
Homepage = "https://github.com/avandeputte/iosuite/tree/main/iohealth"

[tool.setuptools.packages.find]
include = ["app*"]
