name: Server image

# Tests the ioHealth server on MariaDB, then builds it and publishes it to GitHub Container Registry as
# ghcr.io/avandeputte/iohealth. Tags: `latest` and `main-<sha>` on pushes to main, the branch name (with / as -)
# on pushes to other branches, the version on tags like v2.0.0, and `pr-<n>` (build only, no push) on pull requests.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "ioHealth/server/**"
      - ".github/workflows/receiver-image.yml"
  pull_request:
    paths:
      - "ioHealth/server/**"
      - ".github/workflows/receiver-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/iohealth

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: health
          MARIADB_PASSWORD: health
          MARIADB_DATABASE: health_test
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and import checks
        working-directory: ioHealth/server
        run: |
          python -m pip install -q -e ".[test]"
          python -m pyflakes app tests
          python -c "import app.main"
          node --check static/app.js
      - name: Grant the test databases
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'health'@'%'; FLUSH PRIVILEGES;"
      - name: Tests on MariaDB
        working-directory: ioHealth/server
        run: python -m pytest -q -p no:cacheprovider tests

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: ioHealth/server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
